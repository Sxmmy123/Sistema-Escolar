<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <title>Asistencia guiada - prueba responsive aislada</title>
  <style>html,body{margin:0}iframe{position:fixed;top:0;left:0;display:block;width:390px;height:844px;border:0}</style>
</head>
<body>
  <iframe title="Asistencia guiada en celular"></iframe>
  <script>
    const query = new URLSearchParams(location.search), frame = document.querySelector("iframe");
    const width = Number(query.get("ancho")), height = Number(query.get("alto"));
    if ([320,390,768].includes(width)) frame.style.width = `${width}px`;
    if ([520,667,844].includes(height)) frame.style.height = `${height}px`;
    frame.src = query.get("modalidad") === "inicial" ? "./inicial-actividades.html#/docente/asistencia" : "./asistencia-guiada-primaria.html";
  </script>
</body>
</html>
